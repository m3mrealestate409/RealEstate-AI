services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chaahat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaahat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaahat_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chaahat_engine}
    ports:
      # Loopback-only: never publish the database to the host's public/LAN
      # interfaces. Services reach it by name over the compose network.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaahat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chaahat_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # requirepass "" disables auth (dev default); set REDIS_PASSWORD in prod.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      # Loopback-only. Combined with requirepass in prod, Redis is no longer
      # reachable — or commandable — from the host's public/LAN interfaces.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: chaahat_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network, services are reachable by name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chaahat}:${POSTGRES_PASSWORD:-chaahat_pass}@db:5432/${POSTGRES_DB:-chaahat_engine}
      # Empty REDIS_PASSWORD (dev) → no AUTH sent; set it in prod for authed access.
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    ports:
      # Loopback-only, like db/redis — a base-only `docker compose up` must not
      # expose the raw API (and its docs) on the host's public/LAN interfaces.
      # The prod overlay keeps this 127.0.0.1 bind; the public edge is Caddy.
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads

volumes:
  db_data:
  redis_data:
  uploads:
